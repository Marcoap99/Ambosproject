<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  body { margin:0; }
  a { color:#3E8C77; } a:hover { color:#2E6B5B; }
  .root { width:390px; height:844px; background:#F4F2EA; font-family:'IBM Plex Sans', ui-sans-serif, sans-serif; color:#2B2A25; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .header { display:flex; align-items:center; justify-content:space-between; padding:20px 22px 8px; }
  .wordmark { font-family:'Architects Daughter', cursive; font-size:22px; }
  .date { font-size:12px; color:#8A8578; }
  .content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:0 28px; }
  .mascot { width:120px; height:120px; }
  .question { font-family:'Architects Daughter', cursive; font-size:22px; text-align:center; line-height:1.35; }
  .buttons { display:flex; flex-direction:column; gap:12px; width:100%; }
  .btn { border-radius:16px; padding:16px; text-align:center; font-size:16px; font-weight:600; border:2px solid transparent; }
  .btn-yes { background:#3E8C77; color:#FBF9F3; }
  .btn-no { background:transparent; border-color:#C9C3B2; color:#5C574B; }
  .streak { display:flex; align-items:center; gap:8px; font-size:13px; color:#8A8578; }
  .nav { display:flex; justify-content:space-around; padding:16px 0 22px; border-top:1px solid #E4E0D2; }
  .nav svg { width:22px; height:22px; }
</style>
</helmet>
<div class="root">
  <div class="header">
    <div class="wordmark">Ambos</div>
    <div class="date">Lun 8 set</div>
  </div>
  <div class="content">
    <svg class="mascot" viewBox="0 0 120 120" fill="none">
      <circle cx="60" cy="65" r="42" fill="#DCEEE9" stroke="#3E8C77" stroke-width="3"/>
      <circle cx="46" cy="60" r="4" fill="#2B2A25"/>
      <circle cx="74" cy="60" r="4" fill="#2B2A25"/>
      <path d="M46 76 Q60 86 74 76" stroke="#2B2A25" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M60 23 v10" stroke="#3E8C77" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="question">¿Tuviste gastos<br/>con tu pareja hoy?</div>
    <div class="buttons">
      <div class="btn btn-yes">Sí, tuve</div>
      <div class="btn btn-no">No, hoy no</div>
    </div>
    <div class="streak">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8578" stroke-width="2"><path d="M12 2 C8 8 6 11 6 15 a6 6 0 0 0 12 0 c0 -3 -1 -5 -3 -7 c0 2 -1 3 -2 3 c-1 -3 0 -6 -1 -9Z"/></svg>
      Racha: 6 días
    </div>
  </div>
  <div class="nav">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5C574B" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="#5C574B" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="#5C574B" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
  </div>
</div>
</x-dc>
</body>
</html>
