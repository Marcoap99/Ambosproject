<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing:border-box; }
  body { margin:0; }
  a { color:#7FE0C4; } a:hover { color:#5FC7AA; }
  .root { width:390px; height:844px; background:#15181A; font-family:'IBM Plex Sans', ui-sans-serif, sans-serif; color:#EDEFE7; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .header { display:flex; align-items:center; justify-content:space-between; padding:22px 22px 10px; border-bottom:1px solid #262A24; }
  .wordmark { font-family:'IBM Plex Mono', monospace; font-size:15px; letter-spacing:.08em; text-transform:uppercase; }
  .date { font-family:'IBM Plex Mono', monospace; font-size:12px; color:#8B8F84; }
  .content { flex:1; display:flex; flex-direction:column; padding:32px 24px 0; gap:26px; }
  .label { font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#8B8F84; margin-bottom:8px; }
  .question { font-size:19px; font-weight:500; line-height:1.4; }
  .buttons { display:flex; gap:10px; }
  .btn { flex:1; border-radius:4px; padding:16px; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:600; letter-spacing:.03em; }
  .btn-yes { background:#5FBBA3; color:#0E1210; }
  .btn-no { background:transparent; border:1px solid #33362E; color:#EDEFE7; }
  .stat { margin-top:auto; padding:20px 0 26px; border-top:1px solid #262A24; display:flex; justify-content:space-between; font-family:'IBM Plex Mono', monospace; }
  .stat .n { font-size:22px; font-weight:600; }
  .stat .l { font-size:10px; color:#8B8F84; text-transform:uppercase; letter-spacing:.06em; margin-top:4px; }
  .nav { display:flex; justify-content:space-around; padding:14px 0 20px; border-top:1px solid #262A24; }
  .nav svg { width:20px; height:20px; }
</style>
</helmet>
<div class="root">
  <div class="header">
    <div class="wordmark">AMBOS</div>
    <div class="date">LUN 08.09</div>
  </div>
  <div class="content">
    <div>
      <div class="label">Check-in de hoy</div>
      <div class="question">¿Tuviste gastos con tu pareja hoy?</div>
    </div>
    <div class="buttons">
      <div class="btn btn-no">No</div>
      <div class="btn btn-yes">Sí</div>
    </div>
    <div class="stat">
      <div><div class="n">6</div><div class="l">Racha</div></div>
      <div><div class="n">S/0</div><div class="l">Sin ajustar</div></div>
      <div><div class="n">14</div><div class="l">Check-ins</div></div>
    </div>
  </div>
  <div class="nav">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8B8F84" stroke-width="1.6"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="#8B8F84" stroke-width="1.6"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="#8B8F84" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
  </div>
</div>
</x-dc>
</body>
</html>
